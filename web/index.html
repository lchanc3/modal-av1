<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modal-av1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F5F2EC;
    --card: #FFFFFF;
    --line: #E4DFD4;
    --line-soft: #EFEAE0;
    --field: #D9D2C4;
    --fg: #1C1A16;
    --dim: #6B6558;
    --accent: #9A5B2E;
    --accent-hi: #7A4522;
    --ok: #2F7D5B;
    --err: #B03A2E;
    --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --serif: "Noto Serif TC", Georgia, serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 36px; background: var(--bg); color: var(--fg);
         font: 14px/1.6 var(--sans); }
  .wrap { max-width: 1280px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
           margin-bottom: 24px; }
  h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0;
       letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--dim); }

  .tabs { display: flex; gap: 4px; margin: 20px 0 16px; border-bottom: 1px solid var(--line); }
  .tabs button { border: none; border-radius: 0; background: transparent; padding: 10px 18px;
                 font-size: 14px; color: var(--dim); border-bottom: 2px solid transparent;
                 margin-bottom: -1px; }
  .tabs button:hover { color: var(--accent); }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }

  .cols { display: flex; gap: 24px; align-items: flex-start; }
  aside { width: 396px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px;
          position: sticky; top: 32px; }
  main { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card.active { border-left: 3px solid var(--accent); }
  .cap { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--dim); }

  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input, select { width: 100%; background: var(--card); color: var(--fg);
                  border: 1px solid var(--field); border-radius: 7px; padding: 9px 10px;
                  font: 14px var(--sans); }
  input.mono { font-family: var(--mono); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

  button, .btn { font: 13px var(--sans); background: transparent; color: var(--dim);
                 border: 1px solid var(--field); border-radius: 7px; padding: 7px 14px;
                 cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff;
                   font-weight: 700; font-size: 14px; padding: 11px 26px; }
  button.primary:hover { background: var(--accent-hi); color: #fff; }
  button.icon { padding: 6px 9px; line-height: 0; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .drop { border: 1.5px dashed var(--field); border-radius: 10px; padding: 26px 16px;
          text-align: center; color: var(--dim); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.hot { border-color: var(--accent); color: var(--accent); }

  .bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .bar.ok > i { background: var(--ok); }
  .bar.err > i { background: var(--err); }

  .chunks { display: grid; gap: 10px; margin-top: 18px;
            grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); }
  .chunk .bar { height: 4px; margin-top: 5px; }
  .chunk .lbl { font-size: 11px; color: var(--dim); font-family: var(--mono);
                display: flex; justify-content: space-between; }

  .pill { font-size: 11px; border-radius: 99px; padding: 2px 10px; border: 1px solid; }
  .pill.run { color: var(--accent); border-color: #C9A98C; }
  .pill.done { color: var(--ok); border-color: #A8C9B8; }
  .pill.err { color: var(--err); border-color: #D9A69F; }
  .pill.idle { color: var(--dim); border-color: var(--field); }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; color: var(--dim); font-family: var(--mono); font-size: 13px;
           white-space: nowrap; }
  td.act { text-align: right; white-space: nowrap; width: 1%; }

  .days { display: flex; align-items: flex-end; gap: 4px; height: 46px; margin-top: 16px; }
  .days > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
                height: 100%; }
  .days i { display: block; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px;
            opacity: .75; }
  .days i.big { opacity: 1; }

  .mono { font-family: var(--mono); }
  .muted { color: var(--dim); font-size: 12px; }
  .warn { color: #8A6A1F; font-size: 12px; }
  .err { color: var(--err); font-size: 12px; word-break: break-all; }
  .hide { display: none; }

  details.history > summary { list-style: none; cursor: pointer; padding: 13px 18px;
      border: 1px solid var(--line); border-radius: 10px; color: var(--dim); font-size: 13px;
      display: flex; align-items: center; justify-content: space-between; }
  details.history > summary::-webkit-details-marker { display: none; }
  details.history > summary:hover { border-color: var(--accent); color: var(--accent); }
  details.history[open] > summary { border-radius: 10px 10px 0 0; border-bottom: none; }
  details.history .body { border: 1px solid var(--line); border-top: 1px solid var(--line-soft);
      border-radius: 0 0 10px 10px; background: var(--card); padding: 4px 18px; }
  details.history svg { transition: transform .2s; }
  details.history[open] summary svg { transform: rotate(180deg); }

  @media (max-width: 1080px) {
    body { padding: 20px 16px; }
    .cols { flex-direction: column; }
    aside { width: 100%; position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>modal&#8209;av1</h1>
      <p>切段並行轉檔　·　送出後可關掉本頁</p>
    </div>
    <button type="button" onclick="stopApp()">強制停止整個 App</button>
  </header>

  <div class="card" id="budgetCard">
    <div class="spread" style="margin-bottom:14px">
      <div class="cap">本月預算</div>
      <div class="muted mono" id="budgetCycle"></div>
    </div>
    <div class="spread" style="align-items:flex-end">
      <div>
        <div class="mono" id="budgetLeft" style="font-size:34px;font-weight:500;line-height:1">—</div>
        <div class="muted" id="budgetUsed" style="margin-top:6px"></div>
      </div>
      <div style="text-align:right">
        <label for="allowance" style="margin-bottom:4px">每月額度（美元）</label>
        <input class="mono" id="allowance" type="number" step="1" min="1"
               style="width:110px;text-align:right" value="30">
      </div>
    </div>
    <div class="bar" style="margin-top:16px"><i id="budgetBar" style="width:0"></i></div>
    <div id="budgetDays" class="days"></div>
    <div class="muted" id="budgetBreak" style="margin-top:10px"></div>
  </div>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="encode" class="on">轉檔</button>
    <button type="button" data-tab="test">測試</button>
    <button type="button" data-tab="preset">模板</button>
  </nav>

  <section class="panel" id="panel-encode">
  <div class="cols">
    <aside>

      <div class="card">
        <div class="cap" style="margin-bottom:14px">上傳原片</div>
        <div class="drop" id="drop">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <div style="font-size:13px;margin-top:8px">把影片拖進來，或點這裡選檔</div>
        </div>
        <input type="file" id="file" class="hide">
        <div style="margin-top:14px">
          <label for="localPath">或填本機路徑（不複製，直接傳原檔）</label>
          <div class="row">
            <input class="mono" id="localPath" style="font-size:12px" placeholder="D:\Videos\movie.mp4">
            <button type="button" id="localGo" onclick="uploadLocal()">上傳</button>
          </div>
        </div>
        <div id="up" class="hide"></div>
      </div>

      <div class="card">
        <div class="cap" style="margin-bottom:14px">送件</div>

        <div style="margin-bottom:14px">
          <label for="name">來源</label>
          <select id="name"></select>
        </div>

        <div class="grid2" style="margin-bottom:14px">
          <div><label for="preset">preset</label><input class="mono" id="preset" type="number" value="3" min="0" max="13"></div>
          <div><label for="crf">crf</label><input class="mono" id="crf" type="number" value="34" min="1" max="63"></div>
          <div><label for="gop">gop</label><input class="mono" id="gop" type="number" value="600"></div>
          <div><label for="chunk_sec">每段秒數</label><input class="mono" id="chunk_sec" type="number" value="600"></div>
        </div>

        <div style="margin-bottom:14px">
          <label for="cpu">每段核心</label><input class="mono" id="cpu" type="number" value="8" min="1" max="32">
        </div>

        <div style="margin-bottom:14px">
          <label for="svt">svtav1-params</label>
          <input class="mono" id="svt" style="font-size:12px" value="tune=0:enable-overlays=1:enable-qm=1:film-grain=0">
        </div>

        <div class="row" style="margin-bottom:6px">
          <input type="checkbox" id="test"><label for="test" style="margin:0;color:var(--fg);font-size:13px">只轉測試片段</label>
        </div>
        <div id="testOpts" class="hide grid2" style="margin-bottom:14px">
          <div><label for="start">起點</label><input class="mono" id="start" value="00:05:00"></div>
          <div><label for="dur">長度（秒）</label><input class="mono" id="dur" type="number" value="20"></div>
          <div style="grid-column:span 2"><label for="tag">tag（可留空）</label><input class="mono" id="tag" placeholder="自動"></div>
        </div>

        <div class="spread" style="border-top:1px solid var(--line-soft);padding-top:14px;margin-top:14px">
          <div class="muted" id="estimate" style="line-height:1.5"></div>
          <button type="button" class="primary" id="go" onclick="submitJob()">送出</button>
        </div>
      </div>
    </aside>

    <main>
      <div id="active"></div>

      <div class="card">
        <div class="spread" style="margin-bottom:12px">
          <div class="cap">成品</div>
          <div class="muted mono" id="outTotal"></div>
        </div>
        <div id="out"></div>
      </div>

      <div class="card">
        <div class="cap" style="margin-bottom:12px">原片</div>
        <div id="in"></div>
      </div>

      <div class="card hide" id="workCard">
        <div class="spread" style="margin-bottom:10px">
          <div class="cap">暫存切段</div>
          <div class="muted mono" id="workTotal"></div>
        </div>
        <div class="spread">
          <p class="muted" style="margin:0" id="workNote"></p>
          <button type="button" onclick="gcWork()">清理</button>
        </div>
      </div>

      <details class="history" id="hist">
        <summary>
          <span id="histLabel">歷史</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="body" id="histBody"></div>
      </details>
    </main>
  </div>
  </section>

  <section class="panel hide" id="panel-test">
    <div class="cols">
      <aside>
        <div class="card">
          <div class="cap" style="margin-bottom:14px">① 產生無損 ref</div>
          <p class="muted" style="margin:0 0 14px">
            打分的基準。挑有暗部、膚色、快速動作的片段比較有代表性。
          </p>
          <div style="margin-bottom:12px">
            <label for="refSrc">來源</label>
            <select id="refSrc"></select>
          </div>
          <div class="grid2" style="margin-bottom:14px">
            <div><label for="refStart">起點</label><input class="mono" id="refStart" value="00:05:00"></div>
            <div><label for="refDur">長度（秒）</label><input class="mono" id="refDur" type="number" value="20"></div>
          </div>
          <button type="button" id="refGo" onclick="makeRef()">產生 ref</button>
        </div>

        <div class="card">
          <div class="cap" style="margin-bottom:14px">② 掃描 crf</div>
          <div style="margin-bottom:12px">
            <label for="swRef">ref</label>
            <select id="swRef"></select>
          </div>
          <div style="margin-bottom:12px">
            <label for="swCrfs">crf 階梯（逗號分隔）</label>
            <input class="mono" id="swCrfs" value="28,30,32,34,36">
          </div>
          <div class="grid2" style="margin-bottom:12px">
            <div><label for="swPreset">preset</label><input class="mono" id="swPreset" type="number" value="3"></div>
            <div><label for="swCpu">每個 crf 核心</label><input class="mono" id="swCpu" type="number" value="8"></div>
            <div><label for="swMean">門檻・平均</label><input class="mono" id="swMean" type="number" step="0.5" value="95"></div>
            <div><label for="swLow">門檻・最低</label><input class="mono" id="swLow" type="number" step="0.5" value="89"></div>
          </div>
          <div style="margin-bottom:14px">
            <label for="swSvt">svtav1-params</label>
            <input class="mono" id="swSvt" style="font-size:12px" value="tune=0:enable-overlays=1:enable-qm=1:film-grain=0">
          </div>
          <div class="spread">
            <span class="muted" id="swEstimate"></span>
            <button type="button" class="primary" id="swGo" onclick="startSweep()">開始掃描</button>
          </div>
        </div>
      </aside>

      <main>
        <div id="activeTest"></div>
        <div class="card" id="sweepResult">
          <div class="cap" style="margin-bottom:12px">掃描結果</div>
          <p class="muted" style="margin:0">還沒有掃描結果。</p>
        </div>
      </main>
    </div>
  </section>

  <section class="panel hide" id="panel-preset">
    <div class="cols">
      <aside>
        <div class="card">
          <div class="spread" style="margin-bottom:14px">
            <div class="cap" id="tplFormCap">新增模板</div>
            <button type="button" id="tplNew" class="hide" onclick="resetTpl()">取消編輯</button>
          </div>
          <input type="hidden" id="tplId">
          <div style="margin-bottom:12px">
            <label for="tplName">名稱</label>
            <input id="tplName" placeholder="例如：FacialAbuse 系列">
          </div>
          <div style="margin-bottom:12px">
            <label for="tplNote">備註</label>
            <input id="tplNote" placeholder="片源特性、掃描出處…">
          </div>
          <div class="grid2" style="margin-bottom:12px">
            <div><label for="tplPreset">preset</label><input class="mono" id="tplPreset" type="number" value="3"></div>
            <div><label for="tplCrf">crf</label><input class="mono" id="tplCrf" type="number" value="34"></div>
            <div><label for="tplGop">gop</label><input class="mono" id="tplGop" type="number" value="600"></div>
            <div><label for="tplChunk">每段秒數</label><input class="mono" id="tplChunk" type="number" value="600"></div>
            <div><label for="tplCpu">每段核心</label><input class="mono" id="tplCpu" type="number" value="8"></div>
            <div></div>
            <div><label for="tplMean">門檻・平均</label><input class="mono" id="tplMean" type="number" step="0.5" value="95"></div>
            <div><label for="tplLow">門檻・最低</label><input class="mono" id="tplLow" type="number" step="0.5" value="89"></div>
          </div>
          <div style="margin-bottom:14px">
            <label for="tplSvt">svtav1-params</label>
            <input class="mono" id="tplSvt" style="font-size:12px" value="tune=0:enable-overlays=1:enable-qm=1:film-grain=0">
          </div>
          <button type="button" class="primary" onclick="saveTpl()">儲存模板</button>
        </div>

        <div class="card">
          <div class="cap" style="margin-bottom:14px">匯出 / 匯入</div>
          <div class="row">
            <button type="button" onclick="exportTpl()">匯出 JSON</button>
            <button type="button" onclick="document.getElementById('tplFile').click()">匯入</button>
            <input type="file" id="tplFile" accept=".json,application/json" class="hide">
          </div>
          <p class="muted" style="margin:12px 0 0">
            匯入採合併：id 相同的會被覆蓋，其餘新增。沒有名稱的項目會跳過，不會讓整批失敗。
          </p>
        </div>
      </aside>

      <main>
        <div id="tplList"></div>
      </main>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

// ---- 分頁 ----------------------------------------------------------------
// 純前端切換，不動網址也不加路由。輪詢不受分頁影響 —— 背景還在跑的工作
// 不會因為你切到別的分頁就停止更新。
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("hide", p.id !== "panel-" + name));
  try { localStorage.setItem("av1.tab", name); } catch (e) { /* 無痕模式 */ }
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) showTab(b.dataset.tab);
});
try { showTab(localStorage.getItem("av1.tab") || "encode"); } catch (e) { showTab("encode"); }

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mib = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+" GiB" : (b/1048576).toFixed(1)+" MiB";
const hhmmss = s => { s = Math.max(0, Math.round(s));
  return [Math.floor(s/3600), Math.floor(s/60)%60, s%60].map(n => String(n).padStart(2,"0")).join(":"); };
const TERMINAL = ["done", "error", "cancelled"];

const ICON_TRASH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
const ICON_RETRY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

// ---- 上傳 ----------------------------------------------------------------
$("drop").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && doUpload(e.target.files[0]);
["dragenter","dragover"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.add("hot"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.remove("hot"); }));
$("drop").addEventListener("drop", e => {
  const f = e.dataTransfer.files[0]; if (f) doUpload(f);
});

function doUpload(file) {
  const uid = Math.random().toString(16).slice(2, 10);
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", `/api/upload?name=${encodeURIComponent(file.name)}&uid=${uid}`);
  xhr.onload = () => { if (xhr.status !== 200) alert("上傳失敗：" + xhr.responseText); loadFiles(); };
  xhr.onerror = () => alert("上傳失敗（連線中斷）");
  xhr.send(file);
  loadUploads();     // 進度由 server 回報，不靠這個分頁的 XHR 事件
}

// 階段①是本機磁碟複製（3.3 GiB 約 1 分鐘），階段②才是真正的上傳（實測 16 分鐘）。
// 把①講成「上傳」會讓進度條看起來卡在 100% —— 這是實際踩過的坑。
const UP_PHASE = {
  local: "準備檔案中（複製到本機暫存）",
  modal: "上傳到 Modal",
  done:  "上傳完成",
  error: "上傳失敗",
};

async function uploadLocal() {
  const path = $("localPath").value.trim();
  if (!path) return alert("填一個本機檔案路徑");
  $("localGo").disabled = true;
  try {
    const r = await fetch("/api/upload/local", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path})});
    if (!r.ok) throw new Error(await r.text());
    $("localPath").value = "";
    loadUploads();
  } catch (e) { alert("失敗：" + e.message); }
  $("localGo").disabled = false;
}

// 上傳進度一律讀 server 的狀態，所以重新整理、換分頁都還看得到，
// 而且階段②（可能要跑十幾分鐘）不會像以前那樣完全沒有顯示。
async function loadUploads() {
  const ups = await fetch("/api/uploads").then(r => r.json()).catch(() => null);
  if (!ups) return;
  $("up").classList.toggle("hide", ups.length === 0);
  paint($("up"), ups.map(u => {
    const pct = u.total ? Math.min(100, u.sent / u.total * 100) : 0;
    const bad = u.phase === "error";
    return `<div style="margin-top:14px">
      <div class="spread">
        <span class="muted">${esc(u.name)}　${UP_PHASE[u.phase] || u.phase}</span>
        <span class="muted mono">${pct.toFixed(1)}%</span>
      </div>
      <div class="bar ${bad ? "err" : u.phase === "done" ? "ok" : ""}" style="margin-top:6px">
        <i style="width:${pct}%"></i></div>
      ${u.error ? `<div class="err">${esc(u.error)}</div>` : ""}
    </div>`;
  }).join(""));
}

// ---- 送件 ----------------------------------------------------------------
$("test").onchange = e => { $("testOpts").classList.toggle("hide", !e.target.checked); estimate(); };
["preset","crf","chunk_sec","cpu","name"].forEach(id => $(id).onchange = estimate);

function estimate() {
  if ($("test").checked || !$("name").value) { $("estimate").textContent = ""; return; }
  const cpu = +$("cpu").value, chunk = +$("chunk_sec").value;
  // server 不知道片長（要問就得開一個容器跑 ffprobe），所以用 1 小時當基準。
  // 下面的標示會說清楚，免得把估算當成實數看。
  const dur = window._srcDur || 3600;
  const speed = 0.5 * (cpu / 16) * 1.35;        // 16 核 preset 3 實測 0.5x，核心少時效率略高
  const n = Math.max(1, Math.ceil(dur / chunk));
  const hrs = (dur / speed) / 3600;
  const cost = hrs * (cpu * 0.0000131 + cpu * 0.00000222) * 3600;
  const b = window._budget;
  const after = b ? b.remaining - cost : null;
  $("estimate").innerHTML =
    `<span style="opacity:.7">以 1 小時片長估</span>　${n} 段　·　約 ${hhmmss(Math.min(chunk, dur) / speed)}<br>` +
    `<span style="color:var(--accent);font-weight:500" class="mono">≈ $${cost.toFixed(2)}</span>` +
    (after === null ? "" :
      `<span class="mono" style="color:${after < 0 ? "var(--err)" : "var(--dim)"}">` +
      `　→ 剩 $${after.toFixed(2)}</span>`);
}

async function submitJob() {
  const body = {
    name: $("name").value,
    preset: +$("preset").value, crf: +$("crf").value, gop: +$("gop").value,
    chunk_sec: +$("chunk_sec").value, cpu: +$("cpu").value, svt: $("svt").value,
    test: $("test").checked, start: $("start").value, dur: +$("dur").value,
    tag: $("tag").value || "",
  };
  if (!body.name) return alert("先選一個來源檔");
  $("go").disabled = true;
  try {
    const r = await fetch("/api/jobs", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    await loadJobs();
  } catch (e) { alert("送出失敗：" + e.message); }
  $("go").disabled = false;
}

// ---- 模板 ----------------------------------------------------------------
const TPL_FIELDS = {tplName: "name", tplNote: "note", tplPreset: "preset", tplCrf: "crf",
                    tplGop: "gop", tplChunk: "chunk_sec", tplCpu: "cpu",
                    tplMean: "min_mean", tplLow: "min_low", tplSvt: "svt"};

function resetTpl() {
  $("tplId").value = "";
  $("tplFormCap").textContent = "新增模板";
  $("tplNew").classList.add("hide");
  const d = {name: "", note: "", preset: 3, crf: 34, gop: 600, chunk_sec: 600, cpu: 8,
             min_mean: 95, min_low: 89,
             svt: "tune=0:enable-overlays=1:enable-qm=1:film-grain=0"};
  for (const [id, key] of Object.entries(TPL_FIELDS)) $(id).value = d[key];
}

function fillTpl(t, {editing = false} = {}) {
  $("tplId").value = editing ? (t.id || "") : "";
  $("tplFormCap").textContent = editing ? "編輯模板" : "新增模板";
  $("tplNew").classList.toggle("hide", !editing);
  for (const [id, key] of Object.entries(TPL_FIELDS))
    if (t[key] != null) $(id).value = t[key];
  showTab("preset");
  $("tplName").focus();
}

async function saveTpl() {
  const body = {id: $("tplId").value || undefined};
  for (const [id, key] of Object.entries(TPL_FIELDS)) body[key] = $(id).value;
  if (!body.name.trim()) return alert("模板需要名稱");
  const r = await fetch("/api/templates", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) return alert("儲存失敗：" + await r.text());
  resetTpl();
  loadTemplates();
}

  const ts = await fetch("/api/templates").then(r => r.json()).catch(() => null);
  if (!ts) return;
  window._tpl = ts;
  paint($("tplList"), ts.length ? ts.map(t => `
    <div class="card" style="margin-bottom:16px">
      <div class="spread" style="align-items:flex-start">
        <div style="min-width:0">
          <div style="font-family:var(--serif);font-size:19px;font-weight:600">${esc(t.name)}</div>
          ${t.note ? `<div class="muted" style="margin-top:4px">${esc(t.note)}</div>` : ""}
        </div>
        <div class="row">
          <button type="button" class="primary tpl-apply" data-id="${t.id}">套用到送件</button>
          <button type="button" class="tpl-edit" data-id="${t.id}">編輯</button>
          <button type="button" class="tpl-del" data-id="${t.id}">刪除</button>
        </div>
      </div>
      <div class="mono muted" style="margin-top:12px;font-size:12px">
        preset ${t.preset}　crf ${t.crf}　gop ${t.gop}　每段 ${t.chunk_sec}s × ${t.cpu} 核　·
        門檻 ${t.min_mean} / ${t.min_low}
      </div>
      <div class="mono muted" style="margin-top:4px;font-size:11.5px;word-break:break-all">${esc(t.svt)}</div>
    </div>`).join("")
    : '<div class="card"><p class="muted" style="margin:0">還沒有模板。左邊可以新增，或從「測試」分頁的掃描結果一鍵建立。</p></div>');
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const t = (window._tpl || []).find(x => x.id === b.dataset.id);
  if (!t) return;
  if (b.classList.contains("tpl-apply")) applyTpl(t);
  else if (b.classList.contains("tpl-edit")) fillTpl(t, {editing: true});
  else if (b.classList.contains("tpl-del")) delTpl(t);
});

function applyTpl(t) {
  $("preset").value = t.preset; $("crf").value = t.crf; $("gop").value = t.gop;
  $("chunk_sec").value = t.chunk_sec; $("cpu").value = t.cpu; $("svt").value = t.svt;
  $("swPreset").value = t.preset; $("swCpu").value = t.cpu; $("swSvt").value = t.svt;
  $("swMean").value = t.min_mean; $("swLow").value = t.min_low;
  showTab("encode");
  estimate();
}

async function delTpl(t) {
  if (!confirm(`刪除模板「${t.name}」？`)) return;
  await fetch("/api/templates/" + t.id, {method: "DELETE"});
  loadTemplates();
}

function exportTpl() {
  const blob = new Blob([JSON.stringify({version: 1, templates: window._tpl || []}, null, 2)],
                        {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "modal-av1-templates.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("tplFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = "";
  try {
    const data = JSON.parse(await f.text());
    const r = await fetch("/api/templates/import", {

    const s = await r.json();
    alert(`匯入完成：新增 ${s.added}、更新 ${s.updated}、跳過 ${s.skipped}，共 ${s.total} 個`);
    loadTemplates();

async function startSweep() {
  const ref = $("swRef").value;
  if (!ref) return alert("先產生一支 ref");
  const crfs = $("swCrfs").value.split(",").map(s => parseInt(s.trim(), 10)).filter(n => n > 0);

  try {
    await post({mode: "sweep", name: ref.replace(/^in\//, ""), ref: ref, crfs: crfs,
                preset: +$("swPreset").value, cpu: +$("swCpu").value, svt: $("swSvt").value,
                min_mean: +$("swMean").value, min_low: +$("swLow").value});
  } catch (e) { alert("失敗：" + e.message); }
  $("swGo").disabled = false;
}

function sweepEstimate() {
  const crfs = $("swCrfs").value.split(",").filter(s => s.trim()).length;
  const cpu = +$("swCpu").value, dur = +$("refDur").value || 20;
  const speed = 0.5 * (cpu / 16) * 1.35;
  // 打分大約是編碼時間的一半，所以乘 1.5
  const hrs = crfs * (dur / speed) * 1.5 / 3600;
  const cost = hrs * (cpu * 0.0000131 + cpu * 0.00000222) * 3600;
  $("swEstimate").innerHTML = `${crfs} 個 crf 平行　·　<span class="mono">≈ $${cost.toFixed(3)}</span>`;
}

// ---- 工作 ----------------------------------------------------------------
const STATE = {
  queued:    ["排隊中", "idle"], splitting: ["切段中", "run"],
  encoding:  ["編碼中", "run"],  merging:   ["合併中", "run"],
  done:      ["完成",   "done"], error:     ["失敗",   "err"],
  cancelled: ["已取消", "idle"],
};

function chunkCells(j) {
  const cs = j.chunks || [];
  if (cs.length < 2) return "";
  const cells = cs.map(c => {
    const done = c.state === "done";
    const redo = c.state === "encoding" && c.pct < 8 && (j.pct || 0) > 25;
    const col = done ? "var(--ok)" : redo ? "var(--err)" : "var(--accent)";
    const txt = done ? "100%" : c.state === "waiting" ? "—"
              : c.state === "scoring" ? "打分" : (c.pct || 0).toFixed(0) + "%";
    const lbl = c.crf != null ? "crf " + c.crf : "#" + String(c.idx).padStart(2, "0");
    return `<div class="chunk">
      <div class="lbl"><span>${lbl}</span><span style="color:${col}">${txt}</span></div>
      <div class="bar"><i style="width:${c.pct||0}%;background:${col}"></i></div>
    </div>`;
  }).join("");
  const redoing = cs.filter(c => c.state === "encoding" && c.pct < 8 && (j.pct || 0) > 25).length;
  const note = redoing
    ? `<div class="row" style="margin-top:14px;font-size:11.5px;color:var(--err)">${ICON_RETRY}
         <span>有 ${redoing} 段被搶佔，正在重跑（只賠掉那一段）</span></div>`
    : "";
  return `<div class="chunks">${cells}</div>${note}`;
}

const KIND_TITLE = {sweep: "參數掃描", ref: "產生 ref"};

function activeCard(j) {
  const [text, cls] = STATE[j.state] || [j.state, "idle"];
  const title = KIND_TITLE[j.kind] || j.name;
  return `<div class="card active">
    <div class="spread" style="align-items:flex-start">
      <div>
        <div class="row">
          <span style="font-family:var(--serif);font-size:20px;font-weight:600">${esc(title)}</span>
          <span class="pill ${cls}">${text}</span>
          ${j.stale ? '<span class="pill err">driver 已消失</span>' : ""}
        </div>
        <div class="muted mono" style="margin-top:6px">→ ${esc(j.out_name)}${j.total_chunks ? "　·　" + j.total_chunks + " 段" : ""}</div>
      </div>
      <div class="row">
        <span class="mono" style="font-size:30px;font-weight:500;color:var(--accent);line-height:1">${j.pct.toFixed(1)}%</span>
        <button type="button" onclick="cancelJob('${j.job_id}')">取消</button>
      </div>
    </div>
    <div class="bar" style="margin-top:18px"><i style="width:${j.pct}%"></i></div>
    ${chunkCells(j)}
  </div>`;
}

function histRow(j) {
  const [text, cls] = STATE[j.state] || [j.state, "idle"];
  return `<div class="spread" style="padding:11px 0;border-bottom:1px solid var(--line-soft)">
    <div style="min-width:0">
      <div class="row"><span style="font-size:14px">${esc(j.out_name || j.name)}</span>
        <span class="pill ${cls}">${text}</span></div>
      <div class="muted mono">${j.job_id}${j.size ? "　·　" + mib(j.size) : ""}</div>
      ${j.warning ? `<div class="warn">${esc(j.warning)}</div>` : ""}
      ${j.error ? `<div class="err">${esc(j.error)}</div>` : ""}
    </div>
    <button type="button" onclick="forgetJob('${j.job_id}')">移除</button>

}

function paint(el, html) {   // 內容沒變就不動 DOM，避免每 2 秒重繪造成閃爍與操作中斷
  if (html !== el._last) { el.innerHTML = html; el._last = html; }
}

// 重建下拉時保住使用者的選擇，否則每次輪詢都會把選項跳回第一個
function fillSelect(sel, items, value, empty) {
  const keep = sel.value;
  const opts = items.map(x => `<option value="${esc(value(x))}">${esc(x.name)}</option>`).join("")
               || `<option value="">${empty}</option>`;
  if (opts !== sel._last) { sel.innerHTML = opts; sel._last = opts; }
  if (items.some(x => value(x) === keep)) sel.value = keep;
}

const TEST_KINDS = ["sweep", "ref"];

// 同一支 ref 的多次掃描合併成一張表：延伸階梯（先跑 28~36 再補 38/40）
// 是很自然的操作，不該讓後一次把前一次蓋掉。同一個 crf 以最新的為準。
function mergeSweeps(jobs, ref) {
  const byCrf = new Map();
  jobs.filter(j => j.ref === ref).reverse()      // 舊 → 新，後面的覆蓋前面的
      .forEach(j => (j.table || []).forEach(r => byCrf.set(r.crf, {...r})));
  const rows = [...byCrf.values()].sort((a, b) => a.crf - b.crf);
  rows.forEach((r, i) => {
    r.d_vmaf = i ? r.vmaf_mean - rows[i - 1].vmaf_mean : null;
    r.d_size = i ? r.size - rows[i - 1].size : null;
  });
  return rows;
}

function sweepTable(j) {
  const rows = (j.table || []).map(r => {
    const pass = r.vmaf_mean >= j.min_mean && r.vmaf_min >= j.min_low;
    const best = r.crf === j.pick;
    return `<tr style="${best ? "background:#F3EDE4" : ""}">
      <td class="mono" style="${best ? "font-weight:700;color:var(--accent)" : ""}">crf ${r.crf}${best ? "　← 建議" : ""}</td>
      <td class="num">${mib(r.size)}</td>
      <td class="num" style="color:${pass ? "var(--ok)" : "var(--err)"}">${r.vmaf_mean.toFixed(2)}</td>
      <td class="num">${r.vmaf_harmonic.toFixed(2)}</td>
      <td class="num" style="color:${r.vmaf_min >= j.min_low ? "var(--ok)" : "var(--err)"}">${r.vmaf_min.toFixed(2)}</td>
      <td class="num">${r.d_vmaf == null ? "—" : r.d_vmaf.toFixed(2)}</td>
      <td class="num">${r.d_size == null ? "—" : (r.d_size / 1048576).toFixed(2) + " MiB"}</td>
      <td class="act"><button type="button" class="sweep-save" data-crf="${r.crf}"
        data-mean="${r.vmaf_mean.toFixed(2)}" data-low="${r.vmaf_min.toFixed(2)}">存成模板</button></td>
    </tr>`;
  }).join("");
  return `<div class="cap" style="margin-bottom:12px">掃描結果</div>
    <div class="muted mono" style="margin-bottom:10px">${esc(j.ref || "")}　·　門檻 平均 ≥ ${j.min_mean} / 最低 ≥ ${j.min_low}</div>
    <table><thead><tr>
      <td class="muted">參數</td><td class="num muted">體積</td><td class="num muted">平均</td>
      <td class="num muted">調和</td><td class="num muted">最低</td>
      <td class="num muted">ΔVMAF</td><td class="num muted">Δ體積</td><td></td>
    </tr></thead><tbody>${rows}</tbody></table>
    ${j.pick == null
      ? '<p class="warn" style="margin:12px 0 0">沒有任何 crf 同時滿足兩個門檻 —— 把階梯往下延伸（更低的 crf），或放寬門檻。</p>'
      : `<p class="muted" style="margin:12px 0 0">建議 crf ${j.pick}：過門檻之中體積最小的。
         ΔVMAF／Δ體積 是與上一級的差，拐點在哪看這兩欄。
         <strong>VMAF 對色帶與暗部不敏感，最後仍要用播放器看一眼。</strong></p>`}`;
}

async function loadJobs() {
  const list = await fetch("/api/jobs").then(r => r.json());
  const running = list.filter(j => !TERMINAL.includes(j.state));
  const past = list.filter(j => TERMINAL.includes(j.state));

  paint($("active"), running.filter(j => !TEST_KINDS.includes(j.kind)).map(activeCard).join(""));
  paint($("activeTest"), running.filter(j => TEST_KINDS.includes(j.kind)).map(activeCard).join(""));

  const sweeps = past.filter(j => j.kind === "sweep" && j.state === "done" && (j.table || []).length);
  if (sweeps.length) {
    const latest = sweeps[0];
    const merged = mergeSweeps(sweeps, latest.ref);
    const ok = merged.filter(r => r.vmaf_mean >= latest.min_mean && r.vmaf_min >= latest.min_low);
    const pick = ok.length ? ok.reduce((a, b) => a.size <= b.size ? a : b).crf : null;
    window._lastSweepRef = latest.ref;
    paint($("sweepResult"), sweepTable({...latest, table: merged, pick}));
  } else {
    paint($("sweepResult"),
      '<div class="cap" style="margin-bottom:12px">掃描結果</div><p class="muted" style="margin:0">還沒有掃描結果。</p>');
  }
  $("histLabel").textContent = past.length ? `歷史（${past.length} 筆已結束）` : "歷史";
  $("hist").classList.toggle("hide", past.length === 0);
  if ($("hist").open) paint($("histBody"), past.map(histRow).join(""));
}

async function cancelJob(id) {
  if (!confirm("確定取消這個工作？已編碼的段落會留在 Volume 上。")) return;
  await fetch(`/api/jobs/${id}/cancel`, {method: "POST"}); loadJobs();
}
async function forgetJob(id) {
  await fetch("/api/jobs/" + id, {method: "DELETE"});
  $("histBody")._last = null; loadJobs();
}
$("hist").addEventListener("toggle", () => { $("histBody")._last = null; loadJobs(); });

async function loadFiles() {
  const f = await fetch("/api/files").then(r => r.json());

  const isRef = x => x.name.startsWith("ref_");
  fillSelect($("name"), f.in, x => x.name, "（先上傳原片）");
  fillSelect($("refSrc"), f.in.filter(x => !isRef(x)), x => x.name, "（先上傳原片）");
  fillSelect($("swRef"), f.in.filter(isRef), x => x.path, "（先產生 ref）");

  $("outTotal").textContent = f.out.length ? mib(f.out.reduce((s, x) => s + x.size, 0)) : "";
  // 路徑放 data-path 而不是塞進 onclick 的字串裡：檔名含單引號會把字串撐破
  paint($("out"), f.out.length ? `<table><tbody>${f.out.map(x => `
    <tr><td>${esc(x.name)}</td><td class="num">${mib(x.size)}</td><td class="act">
      <a class="btn" href="/api/download?path=${encodeURIComponent(x.path)}">下載</a>
      <button type="button" class="icon rm" data-path="${esc(x.path)}" aria-label="刪除 ${esc(x.name)}">${ICON_TRASH}</button>
    </td></tr>`).join("")}</tbody></table>`
    : '<p class="muted" style="margin:0">還沒有成品。</p>');

  paint($("in"), f.in.length ? `<table><tbody>${f.in.map(x => `
    <tr><td>${esc(x.name)}</td><td class="num">${mib(x.size)}</td><td class="act">
      <button type="button" class="icon rm" data-path="${esc(x.path)}" aria-label="刪除 ${esc(x.name)}">${ICON_TRASH}</button>
    </td></tr>`).join("")}</tbody></table>`
    : '<p class="muted" style="margin:0">還沒有原片。</p>');

  estimate();
  loadWork();
}

// ---- 預算 ----------------------------------------------------------------
// 數字全部來自 Modal 的 billing API（workspace.billing.summary/report），
// 不是本機推算的。唯一存在本機的是「每月額度」—— API 只說用掉多少，不說上限。
async function loadBudget() {
  const b = await fetch("/api/billing").then(r => r.json()).catch(() => null);
  if (!b) return;
  window._budget = b;

  const left = b.remaining, pct = Math.min(100, b.metered / b.allowance * 100);
  const low = left < b.allowance * 0.15;
  $("budgetLeft").textContent = "$" + left.toFixed(2);
  $("budgetLeft").style.color = low ? "var(--err)" : "var(--accent)";
  $("budgetUsed").textContent =
    `已用 $${b.metered.toFixed(2)} / $${b.allowance.toFixed(0)}　·　${pct.toFixed(0)}%`;
  $("budgetCycle").textContent = `${b.cycle_start} ～ ${b.cycle_end}` + (b.stale ? "　·　數字可能過時" : "");
  $("budgetCycle").style.color = b.stale ? "var(--err)" : "";
  const bar = $("budgetBar");
  bar.style.width = pct + "%";
  bar.style.background = low ? "var(--err)" : "var(--accent)";
  if (document.activeElement !== $("allowance")) $("allowance").value = b.allowance;

  // 把週期內每一天都畫出來（沒花錢的補 0），否則只有兩天有資料時
  // 會變成兩個佔半個版面的色塊，看起來不像圖表
  const byDate = Object.fromEntries(b.daily.map(d => [d.date, d.cost]));
  const days = [];
  for (let t = new Date(b.cycle_start + "T00:00"), today = new Date();
       t <= today && days.length < 40; t.setDate(t.getDate() + 1)) {
    const key = t.toLocaleDateString("sv");     // sv locale 就是 YYYY-MM-DD
    days.push({date: key, cost: byDate[key] || 0});
  }
  const max = Math.max(...days.map(d => d.cost), 0.01);
  $("budgetDays").innerHTML = days.map(d => `
    <div title="${d.date}　$${d.cost.toFixed(2)}">
      <i class="${d.cost === max ? "big" : ""}" style="height:${Math.max(d.cost / max * 100, 1)}%"></i>
    </div>`).join("");

  $("budgetBreak").textContent = Object.entries(b.breakdown)
    .map(([k, v]) => `${k} $${v.toFixed(2)}`).join("　·　");
  estimate();
}

$("allowance").onchange = async e => {
  await fetch("/api/billing/allowance", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({allowance: +e.target.value})});
  loadBudget();
};

async function loadWork() {
  const w = await fetch("/api/work").then(r => r.json()).catch(() => null);
  if (!w) return;
  $("workCard").classList.toggle("hide", w.bytes === 0);
  $("workTotal").textContent = mib(w.bytes);
  $("workNote").textContent =
    `${w.dirs.length} 個未完成的工作留下的切段。重送相同參數會直接沿用，不必重編。`;
}

async function gcWork() {
  if (!confirm("清掉所有暫存切段？重送時就得從頭重編。")) return;
  const r = await fetch("/api/work/gc", {method: "POST"});
  if (!r.ok) return alert("清理失敗：" + (await r.text()));
  loadWork();
}

document.addEventListener("click", e => {
  const btn = e.target.closest("button.rm");
  if (btn) rmFile(btn.dataset.path);
});

async function rmFile(path) {
  if (!confirm("刪除 " + path + "？無法復原。")) return;
  await fetch("/api/files?path=" + encodeURIComponent(path), {method: "DELETE"});
  loadFiles();
}

async function stopApp() {
  if (!confirm("這會停掉整個 av1-encode App，所有執行中的容器都會被終止。確定？")) return;
  const r = await fetch("/api/stop-app", {method: "POST"}).then(r => r.json());
  alert(r.ok ? "已停止" : "失敗：" + r.out);
  loadJobs();
}

// 自排程輪詢：每輪等上一輪結束才排下一輪，慢的時候不會堆疊
function poll(fn, gap) {
  (async function loop() {
    try { await fn(); } catch (e) { /* 網路瞬斷就下一輪再說 */ }
    setTimeout(loop, gap);
  })();
}
resetTpl();
loadTemplates();           // 模板只有這台機器會改，不需要輪詢

poll(loadJobs, 2000);
poll(loadUploads, 2000);   // 純本機記憶體讀取，不花錢
poll(loadFiles, 15000);
poll(loadBudget, 300000);  // billing report 有速率限制，server 端也快取 10 分鐘
</script>
